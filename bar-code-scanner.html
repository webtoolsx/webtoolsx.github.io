<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barcode Scanner</title>

    <!-- Include FontAwesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- Include Html5-QRCode Library via CDN -->
    <script
      src="https://unpkg.com/html5-qrcode"
      type="text/javascript"
    ></script>

    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }

      .container {
        max-width: 480px;
        width: 100%;
        background: #1e293b;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        border: 1px solid #334155;
      }

      h2 {
        text-align: center;
        margin-top: 0;
        margin-bottom: 20px;
        color: #38bdf8;
      }

      #reader {
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        border: 2px dashed #475569;
        background: #0f172a;
      }

      /* Override library video styles */
      #reader video {
        object-fit: cover !important;
        border-radius: 8px;
      }

      .result-card {
        margin-top: 20px;
        padding: 16px;
        background: #0f172a;
        border-radius: 12px;
        border: 1px solid #334155;
        text-align: center;
      }

      .result-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #94a3b8;
        margin-bottom: 6px;
      }

      .result-text {
        font-size: 18px;
        font-weight: 600;
        color: #4ade80;
        word-break: break-all;
      }

      .btn-copy {
        background-color: #334155;
        color: #f8fafc;
        border: 1px solid #475569;
        margin-top: 12px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-copy:hover:not(:disabled) {
        background-color: #475569;
      }

      .btn-copy.copied {
        background-color: #16a34a !important;
        color: white !important;
        border-color: #16a34a !important;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }

      button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .btn-start {
        background-color: #0284c7;
        color: white;
      }

      .btn-start:hover {
        background-color: #0369a1;
      }

      .btn-stop {
        background-color: #ef4444;
        color: white;
      }

      .btn-stop:hover {
        background-color: #dc2626;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Barcode Scanner</h2>

      <!-- Camera Preview Viewport -->
      <div id="reader"></div>

      <!-- Scanned Result Display -->
      <div class="result-card">
        <div class="result-title">Scanned Barcode Result</div>
        <div id="result-text" class="result-text">Waiting for scan...</div>
        <button id="copy-btn" class="btn-copy" onclick="copyResult()" disabled>
          <i class="fas fa-copy"></i> Copy Result
        </button>
      </div>

      <!-- Controls -->
      <div class="actions">
        <button id="start-btn" class="btn-start" onclick="startScanner()">
          Start Camera
        </button>
        <button id="stop-btn" class="btn-stop" onclick="stopScanner()" disabled>
          Stop Camera
        </button>
      </div>
    </div>

    <script>
      let html5QrcodeScanner = null;

      // High performance scanning configuration
      const config = {
        fps: 25, // Increased frame rate from 10 to 25 FPS for fast detection
        qrbox: (viewfinderWidth, viewfinderHeight) => {
          return {
            width: Math.min(Math.floor(viewfinderWidth * 0.85), 320),
            height: Math.min(Math.floor(viewfinderHeight * 0.6), 200),
          };
        },
        aspectRatio: 1.333333,
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true, // Use native browser GPU BarcodeDetector API (up to 10x faster)
        },
      };

      function onScanSuccess(decodedText, decodedResult) {
        // Display the decoded text on screen
        document.getElementById("result-text").innerText = decodedText;
        const copyBtn = document.getElementById("copy-btn");
        if (copyBtn) copyBtn.disabled = false;

        // Optional: Play a feedback sound on successful scan
        beep();
      }

      function copyResult() {
        const text = document.getElementById("result-text").innerText;
        if (!text || text === "Waiting for scan...") return;

        navigator.clipboard
          .writeText(text)
          .then(() => {
            const btn = document.getElementById("copy-btn");
            if (!btn) return;
            const originalHTML = btn.innerHTML;
            btn.classList.add("copied");
            btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            setTimeout(() => {
              btn.classList.remove("copied");
              btn.innerHTML = originalHTML;
            }, 2000);
          })
          .catch((err) => {
            console.error("Failed to copy result:", err);
          });
      }

      function onScanFailure(error) {
        // Handle or ignore scan frame failures (fires constantly while seeking)
      }

      function startScanner() {
        if (!html5QrcodeScanner) {
          html5QrcodeScanner = new Html5Qrcode("reader");
        }

        // Camera constraints optimized for speed and autofocus
        const cameraConstraints = {
          facingMode: "environment",
          width: { min: 640, ideal: 1280 },
          height: { min: 480, ideal: 720 },
          focusMode: "continuous",
        };

        html5QrcodeScanner
          .start(
            cameraConstraints,
            config,
            onScanSuccess,
            onScanFailure,
          )
          .then(() => {
            document.getElementById("start-btn").disabled = true;
            document.getElementById("stop-btn").disabled = false;
          })
          .catch((err) => {
            console.error("Unable to start scanning:", err);
            // Fallback to basic environment camera if advanced constraints fail
            html5QrcodeScanner
              .start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanFailure,
              )
              .then(() => {
                document.getElementById("start-btn").disabled = true;
                document.getElementById("stop-btn").disabled = false;
              })
              .catch((fallbackErr) => {
                alert("Camera access failed: " + fallbackErr);
              });
          });
      }

      function stopScanner() {
        if (html5QrcodeScanner) {
          html5QrcodeScanner
            .stop()
            .then(() => {
              document.getElementById("start-btn").disabled = false;
              document.getElementById("stop-btn").disabled = true;
            })
            .catch((err) => console.error("Failed to stop scanner:", err));
        }
      }

      // Audio feedback helper (Optional)
      function beep() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.value = 800;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      }
    </script>
  </body>
</html>
